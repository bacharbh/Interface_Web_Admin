[platformio]
default_envs = esp32_collar

[env:esp32_collar]
platform = espressif32
board = esp32dev
framework = arduino

# Performance optimization for ML inference
build_unflags = -Os
build_flags = 
    -O3
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1

# Dependencies
lib_deps =
    # TensorFlow Lite for Microcontrollers (ESP32 Optimized)
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0
    
    # LoRaWAN connectivity
    mcci-catena/MCCI LoRaWAN LMIC library @ ^4.1.1
    
    # Storage (NVS/Flash)
    vshymanskyy/Preferences @ ^2.1.0

# Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

# Partition Table (Custom to ensure enough space for ML model and code)
board_build.partitions = min_spiffs.csv

[env:debug]
extends = env:esp32_collar
build_flags = 
    ${env:esp32_collar.build_flags}
    -D CORE_DEBUG_LEVEL=5
    -D DEBUG_AI_INFERENCE
